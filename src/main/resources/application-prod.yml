spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tenisskillgames}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
  h2:
    console:
      enabled: false

tenis:
  seguridad:
    jwt:
      secret: ${JWT_SECRET}
  notificaciones:
    modo: prod

logging:
  level:
    ar.edu.uade.tenisskillgames: INFO
